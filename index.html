<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F2EE">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Užrašinė</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2EE;--card:#FFFFFF;--ink:#1D1C22;--ink2:#47444D;--muted:#98939C;--line:#ECE8E2;--soft:#F3F0EB;
  --mark:#FCE98A;--hol:#FFF1B8;--r:20px;
  --sunset:linear-gradient(120deg,#A99BF0 0%,#F2A27A 60%,#F07A3E 100%);
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 1px 2px rgba(29,28,34,.05),0 6px 18px rgba(29,28,34,.04);
}
.ty-gim{--c:#A3264F;--cb:#F9E7ED}.ty-var{--c:#6A55D6;--cb:#EEEBFC}.ty-sv{--c:#8F6D00;--cb:#FFF1B8}
.ty-ivykis{--c:#2F6FD6;--cb:#E6EFFC}.ty-term{--c:#E0601F;--cb:#FDEBDD}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.mono{font-family:var(--mono)}

/* header */
header.top{position:sticky;top:0;z-index:5;background:rgba(244,242,238,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(12px + env(safe-area-inset-top)) 10px 10px 16px;display:flex;align-items:center;gap:2px}
.ttl{flex:1;min-width:0}
.sub{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.top h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.025em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink2)}
.ib:active{background:#E8E4DE}
.ib svg{width:22px;height:22px}
.pill{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:7px 11px;border-radius:999px;background:var(--ink);color:#fff;margin-right:2px}
.syncdot{width:7px;height:7px;border-radius:50%;background:#C9C2B9;display:inline-block;flex:none}
.syncdot.synced{background:#3E8E63}.syncdot.syncing{background:#D9A400}.syncdot.error,.syncdot.offline{background:#C0392B}

main{padding:4px 12px 20px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 16px 8px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;min-height:24px}
.ch h3{margin:0;font-size:15px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);font-weight:850}
.link{font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);padding:5px 8px;border-radius:8px;background:var(--soft);white-space:nowrap}
.hint{font:400 12px var(--mono);color:var(--muted)}
.note{font-size:14px;color:var(--ink2);margin:0 0 10px}

/* tasks */
.task{display:flex;align-items:flex-start;gap:12px;padding:6px 0}
.box{flex:none;width:22px;height:22px;border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center;margin-top:1px;font-weight:800;font-size:16px;line-height:1;color:var(--ink)}
.box svg{width:16px;height:16px}
.b-moved{border-color:var(--muted);color:var(--ink2)}
.b-cancel{border-color:#C9C2B9;color:var(--muted)}
.txt{flex:1;min-width:0;cursor:pointer;padding-top:1px}
.t{overflow-wrap:anywhere}
.tm{font:500 13px var(--mono);color:var(--ink2);margin-right:6px}
.s-done .t{color:var(--ink2)}
.s-moved .t,.s-moved .tm{color:var(--muted)}
.s-cancel .t{color:var(--muted);text-decoration:line-through}
.imp .t{background:linear-gradient(transparent 52%,var(--mark) 52%);padding:0 2px;margin:0 -2px}
.to{display:inline-block;margin-left:8px;font:400 11.5px var(--mono);color:var(--muted);background:var(--soft);padding:1px 8px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.to.cat{color:var(--ink2)}
.to.due{color:#E0601F;background:#FDEBDD}
.rec{font-size:12px;color:var(--muted);margin-left:6px}
.add{display:flex;align-items:center;gap:12px;padding:4px 0 8px;margin:0}
.add .plus{flex:none;width:22px;height:22px;display:grid;place-items:center;color:#B9B2AA;font-size:22px;font-weight:300}
.add input{flex:1;min-width:0;border:0;outline:0;background:none;padding:6px 0;color:var(--ink)}
.add input::placeholder{color:#BDB6AE}

/* events */
.evs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.ev{font-size:13px;font-weight:650;color:var(--c);background:var(--cb);padding:4px 10px;border-radius:999px;text-align:left}
.ev small{font-weight:500;opacity:.75;margin-left:3px}
.ev .tm{color:var(--c);font-size:12px;margin-right:4px}

/* week */
.day .dh{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.day .dname{margin:0;font-size:22px;font-weight:900;letter-spacing:-.02em;text-transform:uppercase;line-height:1.1}
.day .dnum{font:500 13px var(--mono);color:var(--muted);letter-spacing:.04em}
.day.hol .dname{background:linear-gradient(transparent 55%,var(--hol) 55%)}
.badge{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:999px;padding:3px 9px;margin-left:auto}
.day.today{position:relative;overflow:hidden;box-shadow:0 0 0 2px var(--ink),var(--shadow)}
.day.today::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--sunset)}
.day.past{opacity:.9}
.hab{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px;padding-top:10px;border-top:1px dashed var(--line)}
.hab .lab{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:100%}
.hc{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink2);font-weight:650}
.hc.on{background:var(--hc);border-color:var(--hc);color:#fff}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--ink);color:#fff;border-radius:16px;padding:13px 15px;font-size:14px;text-align:left}
.banner span{font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;opacity:.9;white-space:nowrap}
.ur{display:flex;gap:10px;align-items:baseline;padding:5px 0;font-size:15px;width:100%;text-align:left}
.ur .when{font:500 12px var(--mono);color:var(--muted);min-width:78px}
.ur .evn{color:var(--c);font-weight:700}
.ty{font:400 11.5px var(--mono);color:var(--muted);margin-left:auto;white-space:nowrap}

/* month */
.cal{padding:12px 8px 8px}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h div{text-align:center;font:500 11px var(--mono);text-transform:uppercase;color:var(--muted);padding:2px 0 6px}
.c{min-height:64px;border-radius:11px;background:#F8F6F3;padding:5px 4px;display:flex;flex-direction:column;align-items:stretch;text-align:left;overflow:hidden;min-width:0;gap:1px}
.c.empty{background:none}
.c .n{font:500 13px var(--mono);align-self:flex-start;padding:0 4px;border-radius:5px;color:var(--ink)}
.c.hol .n{background:var(--hol)}
.c.we .n{color:var(--ink2)}
.c.t{box-shadow:inset 0 0 0 2px var(--ink)}
.c .e{font-size:9.5px;line-height:1.25;color:var(--c);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kel-row{display:flex;align-items:baseline;gap:10px;padding:6px 0;width:100%;text-align:left}
.kel-row .d{font:500 12px var(--mono);color:var(--c);min-width:58px}
.kel-row .nm{color:var(--c);font-weight:650}
.kform{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.kform .field{padding:10px 12px}
.kform .chips{margin-top:8px}
.kform .chip{padding:6px 11px;font-size:13px}
.term-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.term-row:first-of-type{border-top:0}
.term-row .dot{color:#E0601F;font-size:14px}
.term-row .nm{font-weight:700}
.term-row .meta{font:400 11.5px var(--mono);color:var(--muted)}

/* year */
.yr{display:grid;gap:12px}
@media(min-width:520px){.yr{grid-template-columns:1fr 1fr}}
.ym h3{cursor:pointer}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin:4px 0 8px}
.mini .h{color:var(--muted);font:500 10px var(--mono);padding-bottom:2px}
.mini button{padding:3px 0;border-radius:6px;font:400 12px var(--mono);color:var(--ink2)}
.mini button.hol{background:var(--hol);color:var(--ink)}
.mini button.hasev{color:var(--c);font-weight:600}
.mini button.tdy{box-shadow:inset 0 0 0 1.5px var(--ink)}
.yl{display:flex;gap:8px;align-items:baseline;font-size:14px;padding:2px 0;width:100%;text-align:left}
.yl .d{font:500 12px var(--mono);min-width:22px;color:var(--ink2)}
.yl .nm{color:var(--c);font-weight:650}
.wide{width:100%;padding:15px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font:500 13px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}

/* habits */
table.ht{border-collapse:separate;border-spacing:3px;width:calc(100% + 12px);margin:0 -6px;table-layout:fixed}
.ht thead th{position:sticky;top:calc(66px + env(safe-area-inset-top));background:var(--card);z-index:2;vertical-align:bottom;padding:4px 0 8px}
.ht th .v{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;margin:0 auto;max-height:130px;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;font-weight:850;text-transform:uppercase;letter-spacing:.02em;color:var(--hc)}
.ht col.dcol{width:48px}
.ht td{padding:0}
.ht td.dd{font:500 12.5px var(--mono);color:var(--ink2);text-align:left;padding:0 2px 0 4px;white-space:nowrap;text-transform:uppercase}
.ht td.dd small{color:var(--muted);font-size:10.5px;margin-left:3px}
.ht tr.we td.dd small{color:#E0601F}
.ht tr.today td.dd{background:var(--ink);color:#fff;border-radius:7px}
.ht tr.today td.dd small{color:#fff}
.ht .cell{display:block;width:100%;height:30px;border-radius:7px;background:#F2EFEA}
.ht .cell.on{background:var(--hc)}
.ht tr.today .cell:not(.on){box-shadow:inset 0 0 0 1.5px var(--ink)}
.ht tfoot td{font:500 12px var(--mono);text-align:center;padding:8px 0 2px;color:var(--hc)}
.empty-state{text-align:center;padding:24px 18px}

/* shop */
.shop-add{display:flex;gap:8px}
.shop-add input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;background:#FBFAF8;outline:0;font-size:16px}
.shop-add input:focus{border-color:var(--ink)}
.shop-add button{width:50px;border-radius:14px;background:var(--ink);color:#fff;font-size:24px}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.sug button{font-size:13px;padding:5px 11px;border-radius:999px;background:var(--soft);color:var(--ink2);font-weight:600}
.si{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line);font-size:17px}
.si:first-child{border-top:0}
.si .box{width:24px;height:24px}
.si.done .t{color:var(--muted);text-decoration:line-through}
.si.done .box{border-color:#C9C2B9;color:var(--muted)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(20,18,16,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;max-height:90vh;overflow:auto;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding:8px 18px calc(22px + env(safe-area-inset-bottom));visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.grab{width:40px;height:5px;border-radius:3px;background:#DDD7CF;margin:4px auto 14px}
.sheet h2{margin:0 0 12px;font-size:22px;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#FBFAF8;outline:0;resize:none}
.field:focus{border-color:var(--ink)}
.field.sm{width:auto;padding:9px 12px}
.lbl{font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:650;color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.primary{width:100%;margin-top:18px;padding:15px;border-radius:14px;background:var(--ink);color:#fff;font:500 13px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.act{padding:10px 13px;border-radius:12px;background:var(--soft);font-size:14px;font-weight:650}
.act.danger{color:#B3261E}
.daterow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.daterow .field{flex:1;padding:9px 12px;min-width:130px}
.daterow .field.tm-in{flex:0 0 110px;min-width:0}
.ri{padding:12px 0;border-top:1px solid var(--line)}
.ri.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ri.tap{cursor:pointer;width:100%;text-align:left}
.rt{font-weight:650}
.ro{font:400 12px var(--mono);color:var(--muted);margin:3px 0 8px}
.ri .btnrow .act{padding:7px 11px;font-size:13px}
.info{margin:12px 0;padding:10px 12px;background:var(--soft);border-radius:12px;font-size:14px}
.preview{margin-top:14px;padding:11px 13px;border-radius:12px;background:#FDEBDD;color:#8A3A10;font-size:14px}
.done-msg{text-align:center;padding:24px 0;font-size:17px;font-weight:650}
.legend{display:grid;gap:10px}
.legend>div{display:flex;align-items:center;gap:12px;font-size:15px}
.row-btn{display:flex;width:100%;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line);text-align:left;font-size:15px}
.sw{width:42px;height:24px;border-radius:999px;background:#D9D3CB;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ink)}.sw.on::after{left:21px}
textarea.json{font:12px/1.4 var(--mono);height:160px}

/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 10px;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--ink)}
.tab.on svg{color:#E0601F}
.fab{position:fixed;z-index:11;right:max(16px,calc(50% - 264px));bottom:calc(80px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:19px;background:var(--sunset);color:#fff;box-shadow:0 8px 22px rgba(240,122,62,.4);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
.toast{position:fixed;left:50%;bottom:calc(152px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.cols .task{gap:9px}.cols .t{font-size:15px}.cols .add{gap:9px}
.col-h{display:flex;justify-content:space-between;align-items:center;gap:6px;font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:4px 0 4px;min-height:24px}
.col-h .link{padding:3px 7px;font-size:10.5px}
.wsec{margin-top:4px;padding-top:6px;border-top:1px dashed var(--line)}
.proj>.task .t{font-weight:850;text-transform:uppercase;letter-spacing:.02em}
.pk{margin-left:10px;padding-left:20px;border-left:2px solid var(--line)}
.add.sub input{font-size:14px}
.auth{position:fixed;inset:0;z-index:45;background:var(--bg);display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:380px;background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:26px 22px;position:relative;overflow:hidden}
.auth-card::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--sunset)}
.auth-card h2{margin:0 0 6px;font-size:28px;font-weight:900;text-transform:uppercase;letter-spacing:-.02em}
.auth-card .field{margin-top:10px}
.auth-card .act{width:100%;margin-top:10px;padding:13px}
.auth-msg{font-size:14px;color:#B3261E;margin:12px 0 0;min-height:1em}
.veil{position:fixed;inset:0;z-index:40;background:rgba(244,242,238,.7);display:grid;place-items:center;font:500 13px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="ib" data-act="prev" id="prevBtn" aria-label="Atgal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl"><div class="sub" id="sub"></div><h1 id="title"></h1></div>
    <button class="pill" data-act="today" id="todayBtn" hidden>Šiandien</button>
    <button class="ib" data-act="next" id="nextBtn" aria-label="Pirmyn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="ib" data-act="settings" aria-label="Nustatymai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h9M18 7h2M4 17h4M13 17h7"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="10.5" cy="17" r="2.3"/></svg></button>
  </header>
  <main id="main"></main>
</div>

<button class="fab" data-act="quick" aria-label="Naujas įrašas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs"><div class="in">
  <button class="tab" data-act="tab" data-view="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M7.5 13.5h9M7.5 17h5"/></svg>Savaitė</button>
  <button class="tab" data-act="tab" data-view="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 3v3M16 3v3"/><g fill="currentColor" stroke="none"><circle cx="8" cy="13.3" r="1"/><circle cx="12" cy="13.3" r="1"/><circle cx="16" cy="13.3" r="1"/><circle cx="8" cy="17" r="1"/><circle cx="12" cy="17" r="1"/></g></svg>Mėnuo</button>

    const v5={},v3={};Object.keys(all).forEach(k=>{if(k.indexOf(NS)===0)v5[k]=all[k];else if(k.indexOf(OLD)===0)v3[k]=strip(all[k])});
    const local=S,localOk=local&&local.settings&&local.settings.started&&hasData(local),merged=getFlag(uid);let base=null;

    if(first){lastSnap=snap;if(snap.metadata.fromCache)return;finish(snap,false);return}

}

/* ---------- terms (payments / deadlines) ---------- */
function dueOf(r,ym){if(r.freq==='monthly')return ym+'-'+pad(Math.min(r.d,daysIn(ym)));if(mIdx(ym)+1===r.m)return ym+'-'+pad(Math.min(r.d,daysIn(ym)));return null}
function remindOf(r,due){if(r.mode==='wd'&&r.wd&&r.wd.length){for(let i=0;i<21;i++){const s=addDays(due,-i);if(r.wd.includes(wdi(s)))return s}return due}return addDays(due,-(+r.before||0))}
function nextDue(r){const t=TODAY();for(let i=0;i<14;i++){const ym=addMonths(mk(t),i);const d=dueOf(r,ym);if(d&&d>=t)return d}return null}
function genTerms(){if(booting)return;const t=TODAY(),hor=addDays(t,45);let ch=false;
  S.terms.forEach(r=>{for(let i=-1;i<14;i++){const ym=addMonths(mk(t),i);const due=dueOf(r,ym);if(!due||due<addDays(t,-7))continue;const rem=remindOf(r,due);if(rem>hor||rem<(r.from||'0'))continue;
    const k='t|'+r.id+'|'+due;if(S.gen[k])continue;S.gen[k]=1;const gid='t-'+r.id+'-'+due;if(!byId(gid))newTask(r.title,{date:rem},{id:gid,term:r.id,note:'iki '+(pd(due).getDate())+' d.',imp:true});ch=true}});
  if(ch)save()}

/* ---------- domain ---------- */
function eventsOn(s){const[y,m,d]=s.split('-').map(Number);const out=[];
  S.events.forEach(ev=>{if(ev.repeat==='yearly'&&ev.m===m&&ev.d===d)out.push(ev);else if(ev.repeat==='monthly'&&Math.min(ev.d,daysIn(mk(s)))===d)out.push(ev);else if(ev.repeat==='once'&&ev.y===y&&ev.m===m&&ev.d===d)out.push(ev)});
  S.terms.forEach(r=>{if(dueOf(r,mk(s))===s)out.push({id:r.id,title:r.title,type:'term',term:true,repeat:r.freq})});
  if(S.settings.hol)(holidays(y)[s]||[]).forEach(n=>out.push({id:null,title:n,type:'sv',hol:true}));
  const rank={sv:0,gim:1,var:2,ivykis:3,term:4};out.sort((a,b)=>(rank[a.type]-rank[b.type])||((a.time||'')<(b.time||'')?-1:1));return out}
const isHol=s=>!!(S.settings.hol&&holidays(+s.slice(0,4))[s]);
const byTime=(a,b)=>{const x=a.time||'99',y=b.time||'99';return x<y?-1:x>y?1:0};
const dayTasks=s=>S.tasks.filter(t=>t.date===s).sort(byTime);
const isWork=t=>t.cat==='darbo'||t.list==='darbo';
const weekPlan=(w,c)=>S.tasks.filter(t=>t.week===w&&!t.date&&(c==='darbo'?isWork(t):!isWork(t)));
const monthList=(m,l)=>S.tasks.filter(t=>t.month===m&&t.list===l&&!t.date);
let cSeq=0;const nextC=()=>Date.now()*100+(cSeq++%100);
function newTask(text,place,extra){const t=Object.assign({id:uid(),c:nextC(),text:String(text).trim(),status:'open',imp:false,date:null,week:null,month:null,list:null,src:null,kind:null},place,extra||{});S.tasks.push(t);return t}
function leaf(t){let c=t,g=0;while(g++<50){const ch=S.tasks.find(x=>x.src===c.id);if(!ch)break;c=ch}return c===t?null:c}
function setStatus(t,st){t.status=st;let c=t,g=0;while(c.src&&g++<50){const p=byId(c.src);if(!p)break;if(c.kind==='sched')p.status=(st==='done')?'done':'moved';c=p}}
function samePlace(a,pl){return (a.date||null)===(pl.date||null)&&(a.week||null)===(pl.week||null)&&(a.month||null)===(pl.month||null)}
function ensureProj(p,place){const ex=S.tasks.find(x=>x.isProj&&x.status==='open'&&x.text===p.text&&samePlace(x,place));if(ex)return ex.id;return newTask(p.text,place,{isProj:true,cat:p.cat||'darbo'}).id}
function moveTask(t,place,kind,extra){let parent=null;if(t.parent){const p=byId(t.parent);if(p)parent=ensureProj(p,place)}
  const c=newTask(t.text,place,Object.assign({imp:t.imp,src:t.id,kind:kind||'mig',time:place.date?t.time||null:null,note:t.note||null,cat:t.cat||(t.list==='darbo'?'darbo':null),isProj:!!t.isProj,parent},extra||{}));t.status='moved';
  if(t.isProj)S.tasks.filter(k=>k.parent===t.id&&k.status==='open').forEach(k=>{newTask(k.text,place,{imp:k.imp,src:k.id,kind:kind||'mig',cat:k.cat||'darbo',parent:c.id});k.status='moved'});
  return c}
function delTask(id){const t=byId(id);if(t&&t.isProj)S.tasks.filter(k=>k.parent===id).forEach(k=>delTask(k.id));S.tasks=S.tasks.filter(x=>x.id!==id);S.tasks.forEach(x=>{if(x.src===id){x.src=null;x.kind=null}});
  if(t&&t.src){const p=byId(t.src);if(p&&p.status!=='open'&&!S.tasks.some(x=>x.src===p.id))p.status='open'}}
function placeLabel(t){if(t.date)return shortDate(t.date);if(t.week)return t.week===mondayOf(TODAY())?'sav. planai':'kitos sav. planai';if(t.month)return (LISTN[t.list]||'sąrašas').toLowerCase()+' · '+LT_MONTHS[mIdx(t.month)].toLowerCase();return ''}
function originLabel(t){if(t.date)return cap(WD[wdi(t.date)])+', '+longDate(t.date);if(t.week)return 'Savaitės planai · '+rangeLabel(t.week,addDays(t.week,6));if(t.month)return (LISTN[t.list]||'Sąrašas')+' · '+LT_MONTHS[mIdx(t.month)];return ''}
const STL={open:'Planas',done:'Įvykdyta',moved:'Perkelta',cancel:'Atšaukta'};
function genRecurring(week){const t=TODAY();if(booting||week<mondayOf(t))return;let ch=false;
  S.rec.forEach(r=>{for(let i=0;i<7;i++){const s=addDays(week,i);if(s<(r.from||'0'))continue;
    const hit=r.freq==='monthly'?(+s.slice(8)===Math.min(r.dom||1,daysIn(mk(s)))):r.days.includes(i);if(!hit)continue;
    const k=r.id+'|'+s;if(!S.gen[k]){S.gen[k]=1;const gid='r-'+r.id+'-'+s;if(!byId(gid)&&!S.tasks.some(x=>x.rec===r.id&&x.date===s))newTask(r.text,{date:s},{id:gid,rec:r.id,time:r.time||null});ch=true}}});if(ch)save()}
function habitsFor(m){if(S.habits[m])return S.habits[m];const keys=Object.keys(S.habits).filter(k=>k<m&&S.habits[k]&&S.habits[k].length).sort();
  if(keys.length&&m<=addMonths(mk(TODAY()),1)){S.habits[m]=S.habits[keys[keys.length-1]].map(h=>({id:h.id,name:h.name,c:h.c}));save();return S.habits[m]}return []}
const hcol=(h,i)=>h.c||HCOL[i%HCOL.length];
const hkey=(m,h,d)=>m+'|'+h+'|'+d;
function overdue(){const t=TODAY(),lim=addDays(t,-30);return S.tasks.filter(x=>x.date&&x.status==='open'&&x.date<t&&x.date>=lim)}
function leftovers(pm){return S.tasks.filter(x=>x.status==='open'&&(x.month===pm||(x.week&&!x.date&&mk(x.week)===pm)||(x.date&&mk(x.date)===pm)))}
function upcoming(from,n){const out=[];for(let i=0;i<n;i++){const s=addDays(from,i);eventsOn(s).filter(e=>!e.hol).forEach(e=>out.push({s,i,e}))}return out}

/* ---------- rendering pieces ---------- */
function boxIcon(st){return st==='done'?CHECK:st==='moved'?'›':st==='cancel'?'–':''}
function taskRow(t,opt){opt=opt||{};const l=t.status!=='open'?leaf(t):null;

  const cat=opt.cat?`<span class="to cat">${esc(LISTN[t.list]||'')}</span>`:'';

function evChip(e){const sh=ESHORT[e.type]||'';const act=e.term?`data-act="edit-term" data-id="${e.id}"`:e.id?`data-act="edit-event" data-id="${e.id}"`:'';

function weekView(){genRecurring(curWeek);genTerms();const today=TODAY(),isCur=curWeek===mondayOf(today);let h='';
  if(isCur){const od=overdue();if(od.length)h+=`<button class="banner" data-act="review-days">Neužbaigta praėjusiomis dienomis: <b>${od.length}</b><span>Peržiūrėti ›</span></button>`;

  const wctx={kind:'week',key:curWeek};
  h+=`<section class="card"><div class="ch"><h3>Savaitės planai</h3><button class="link" data-act="recurring">⟳ Kartojasi</button></div><div class="cols"><div><div class="col-h">Darbas ${projLink(wctx)}</div>${listHtml(weekPlan(curWeek,'darbo'),wctx)}${addRow('week',curWeek,'','Pridėti…','darbo')}</div><div><div class="col-h">Asmeniniai</div>${listHtml(weekPlan(curWeek,'asm'),wctx)}${addRow('week',curWeek,'','Pridėti…','asm')}</div></div></section>`;
  for(let i=0;i<7;i++){const s=addDays(curWeek,i),evs=eventsOn(s),isT=s===today;

  return h}

function dayBody(s){const ts=dayTasks(s),ctx={kind:'day',key:s};return `${listHtml(ts.filter(t=>!isWork(t)),ctx)}${addRow('day',s,'','Pridėti…','asm')}<div class="wsec"><div class="col-h">Darbas ${projLink(ctx)}</div>${listHtml(ts.filter(isWork),ctx)}${addRow('day',s,'','Pridėti…','darbo')}</div>`}

  LISTS.forEach(([k,name])=>{const ctx={kind:'month',key:m,list:k};h+=`<section class="card"><div class="ch"><h3>${name}</h3>${k==='darbo'?projLink(ctx):''}</div>${listHtml(monthList(m,k),ctx)}${addRow('month',m,k,'Pridėti…',k==='darbo'?'darbo':'')}</section>`});

  <div class="kform"><input class="field" id="k-text" placeholder="Kas keliasi į ${LT_ACC[mIdx(nm)]}?" autocomplete="off" enterkeyhint="done"><div class="chips">${[['asm','Asmeniniai'],['darbo','Darbo'],['pirk','Pirkiniai'],['date','📅 Konkreti data']].map(([v,l])=>`<button class="chip${K.list===v?' on':''}" data-act="kchip" data-val="${v}">${l}</button>`).join('')}</div><div class="daterow" id="k-daterow" ${K.list==='date'?'':'hidden'}><input type="date" class="field" id="k-date" value="${nm}-01"><input type="time" class="field tm-in" id="k-time"></div><button class="primary" style="margin-top:12px" data-act="kel-add">Pridėti</button></div><div style="height:8px"></div></section>`;
  h+=`<section class="card"><div class="ch"><h3>Mokėjimai ir terminai</h3><button class="link" data-act="add-term">+ Naujas</button></div>${S.terms.some(r=>/pole/i.test(r.title))?'':'<button class="act" style="margin:4px 0 8px" data-act="pole-restore">+ Atkurti „Sumokėti už pole“ (An/Kt iki 28 d.)</button>'}${termRows()||'<p class="hint" style="margin:0 0 8px">Pvz. šokių apmokėjimas iki 28 d., draudimo ar dokumentų galiojimas.</p>'}</section>`;

function mini(m){const off=wdi(m+'-01'),n=daysIn(m),t=TODAY();let h=WDS.map(w=>`<span class="h">${w[0]}</span>`).join('');for(let i=0;i<off;i++)h+='<span></span>';

function habitsView(){const m=curMonth,hs=habitsFor(m),n=daysIn(m),today=TODAY();
  if(!hs.length)return `<section class="card empty-state"><p class="note">${LT_MONTHS[mIdx(m)]} dar neturi įpročių sąrašo.</p><button class="primary" data-act="habits-edit">+ Sudaryti įpročių sąrašą</button></section>`;
  let h=`<section class="card"><div class="ch"><h3>Rutina</h3><button class="link" data-act="habits-edit">Keisti sąrašą</button></div><table class="ht"><colgroup><col class="dcol">${hs.map(()=>'<col>').join('')}</colgroup><thead><tr><th></th>${hs.map((x,i)=>`<th style="--hc:${hcol(x,i)}"><div class="v">${esc(x.name)}</div></th>`).join('')}</tr></thead><tbody>`;
  for(let d=1;d<=n;d++){const s=m+'-'+pad(d),w=wdi(s);h+=`<tr class="${s===today?'today':''}${w>=5?' we':''}" ${s===today?'id="h-today"':''}><td class="dd">${d}<small>${WDS[w]}</small></td>${hs.map((x,i)=>{const on=S.hlog[hkey(m,x.id,d)];return `<td><button class="cell${on?' on':''}" style="--hc:${hcol(x,i)}" data-act="habit" data-m="${m}" data-h="${x.id}" data-d="${d}" aria-label="${esc(x.name)} ${d}"></button></td>`}).join('')}</tr>`}
  h+=`</tbody><tfoot><tr><td class="dd">Viso</td>${hs.map((x,i)=>{let c=0;for(let d=1;d<=n;d++)if(S.hlog[hkey(m,x.id,d)])c++;return `<td style="--hc:${hcol(x,i)}">${c}</td>`}).join('')}</tr></tfoot></table></section>`;
  return h}

function shopView(){const open=S.shop.filter(x=>!x.done),done=S.shop.filter(x=>x.done);const inList=new Set(S.shop.filter(x=>!x.done).map(x=>x.text.toLowerCase()));
  const sug=Object.entries(S.shopHist).filter(([k])=>!inList.has(k.toLowerCase())).sort((a,b)=>b[1]-a[1]).slice(0,14);
  let h=`<section class="card" style="padding-bottom:14px"><form class="shop-add" id="shop-form"><input id="shop-in" placeholder="Ko reikia nupirkti?" autocomplete="off" enterkeyhint="done"><button aria-label="Pridėti">+</button></form>${sug.length?`<div class="sug">${sug.map(([k])=>`<button data-act="shop-sug" data-name="${esc(k)}">+ ${esc(k)}</button>`).join('')}</div>`:''}</section>`;
  h+=`<section class="card"><div class="ch"><h3>Reikia nupirkti</h3><span class="hint">${open.length}</span></div>${open.length?`<div>${open.map(shopRow).join('')}</div>`:'<p class="hint" style="margin:4px 0 10px">Sąrašas tuščias.</p>'}</section>`;
  if(done.length)h+=`<section class="card"><div class="ch"><h3>Nupirkta</h3><button class="link" data-act="shop-clear">Išvalyti</button></div><div>${done.map(shopRow).join('')}</div></section>`;
  return h}
function shopRow(x){return `<div class="si${x.done?' done':''}"><button class="box" data-act="shop-toggle" data-id="${x.id}">${x.done?CHECK:''}</button><span class="txt" data-act="shop-edit" data-id="${x.id}"><span class="t">${esc(x.text)}</span></span></div>`}
function addShop(name){name=String(name).trim();if(!name)return;const ex=S.shop.find(x=>!x.done&&x.text.toLowerCase()===name.toLowerCase());if(ex){toast('Jau sąraše');return}S.shop.unshift({id:uid(),text:name,done:false,t:Date.now()});const k=Object.keys(S.shopHist).find(k=>k.toLowerCase()===name.toLowerCase())||name;S.shopHist[k]=(S.shopHist[k]||0)+1}

function renderHeader(){const t=TODAY();let title,sub,isCur=true;
  if(view==='week'){title=rangeLabel(curWeek,addDays(curWeek,6));sub='Savaitė';isCur=curWeek===mondayOf(t)}
  else if(view==='month'||view==='habits'){title=LT_MONTHS[mIdx(curMonth)];sub=(view==='habits'?'Įpročiai · ':'Mėnuo · ')+curMonth.slice(0,4);isCur=curMonth===mk(t)}
  else if(view==='year'){title=String(curYear);sub='Metai';isCur=curYear===+t.slice(0,4)}
  else{title='Pirkiniai';sub='Kasdienis sąrašas'}
  $('#title').textContent=title;$('#sub').innerHTML=`<span class="syncdot ${syncState}"></span>${esc(sub)}`;$('#todayBtn').hidden=isCur&&view!=='week';
  $('#prevBtn').style.visibility=$('#nextBtn').style.visibility=view==='shop'?'hidden':'visible';
  $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view===view))}
let scrollWant=false;
function renderMain(){renderHeader();const m=$('#main');try{m.innerHTML=view==='week'?weekView():view==='month'?monthView():view==='year'?yearView():view==='habits'?habitsView():shopView()}catch(err){console.error(err);m.innerHTML=`<section class="card"><p class="note">Nepavyko parodyti šio puslapio: ${esc(err&&err.message)}</p><button class="act" data-act="settings">Nustatymai</button></section>`}
  if(scrollWant){scrollWant=false;try{if(view==='habits'){const r=$('#h-today');if(r)r.scrollIntoView({block:'center'})}else if(view==='week'&&curWeek===mondayOf(TODAY())){const c=document.getElementById('d-'+TODAY());if(c){const hh=$('header.top').offsetHeight;window.scrollTo(0,Math.max(0,c.getBoundingClientRect().top+window.scrollY-hh-10))}}else window.scrollTo(0,0)}catch(e){}}}
function render(){const a=document.activeElement;const keep=a&&a.id&&$('#main').contains(a)&&a.tagName==='INPUT'?{id:a.id,v:a.value}:null;
  renderMain();const top=stack[stack.length-1];if(top&&top.live)$('#sheet-body').innerHTML=top.fn();
  if(keep){const n=document.getElementById(keep.id);if(n&&keep.id!=='shop-in'){n.value=keep.v}}}

/* ---------- sheets ---------- */
const stack=[];let F={};
function openSheet(fn,live,extra){stack.push(Object.assign({fn,live},extra||{}));drawSheet();$('#sheet').scrollTop=0}
function drawSheet(){const top=stack[stack.length-1];if(!top){$('#sheet').classList.remove('on');$('#bd').classList.remove('on');return}$('#sheet-body').innerHTML=top.fn();$('#sheet').classList.add('on');$('#bd').classList.add('on')}
function closeSheet(all){if(all)stack.length=0;else stack.pop();drawSheet();renderMain();setTimeout(applyRemote,200)}
function chipGroup(group,obj,cur){return Object.entries(obj).map(([v,l])=>`<button class="chip${v===cur?' on':''}" data-act="chip" data-group="${group}" data-val="${v}">${l}</button>`).join('')}
function setChip(group,val){F[group]=val;$$(`.chip[data-group="${group}"]`).forEach(c=>c.classList.toggle('on',c.dataset.val===val))}
const wdChips=(act,sel)=>WDS.map((w,i)=>`<button class="chip${sel.includes(i)?' on':''}" data-act="${act}" data-i="${i}">${w}</button>`).join('');
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1900)}

function openTask(id){openSheet(()=>{const t=byId(id);if(!t)return '<p class="note">Įrašas ištrintas.</p><button class="primary" data-act="close">Uždaryti</button>';
  const ch=S.tasks.find(x=>x.src===t.id);const td=TODAY();
  let h=`<textarea class="field" id="t-text" rows="2" data-id="${t.id}">${esc(t.text)}</textarea><div class="ro" style="margin-top:8px">${esc(originLabel(t))} · ${STL[t.status]}</div>`;
  if(t.date)h+=`<div class="daterow" style="margin-top:4px;align-items:center"><span class="hint">Laikas</span><input type="time" class="field tm-in" id="t-time" data-id="${t.id}" value="${esc(t.time||'')}"></div>`;
  if(t.rec)h+=`<button class="info" style="display:block;width:100%;text-align:left" data-act="edit-rec" data-id="${t.rec}">⟳ Kartojasi – keisti visą pasikartojimą ›</button>`;
  if(t.rec&&t.date&&t.status==='open'){const wk=mondayOf(t.date);h+=`<div class="lbl">Tik šią savaitę perkelti į</div><div class="chips">${[0,1,2,3,4,5,6].map(i=>{const s=addDays(wk,i);return s===t.date?'':`<button class="chip" data-act="rec-shift" data-id="${t.id}" data-date="${s}">${WDS[i]} ${pd(s).getDate()}</button>`}).join('')}</div>`}
  if(t.term)h+=`<button class="info" style="display:block;width:100%;text-align:left" data-act="edit-term" data-id="${t.term}">● Mokėjimas / terminas – keisti ›</button>`;
  if(t.status==='moved'&&ch){const l=leaf(t);h+=`<div class="info">Perkelta → <b>${esc(placeLabel(l))}</b></div>`}
  else{h+=`<div class="btnrow" style="margin-top:10px"><button class="act" data-act="t-done" data-id="${t.id}">${t.status==='done'?'↩ Neįvykdyta':'✓ Įvykdyta'}</button><button class="act" data-act="t-imp" data-id="${t.id}">${t.imp?'☆ Nebesvarbu':'★ Svarbu'}</button><button class="act" data-act="t-cancel" data-id="${t.id}">${t.status==='cancel'?'↩ Grąžinti':'– Atšaukti'}</button></div>`;
    if(t.status==='open'){
      if(t.week){h+=`<div class="lbl">Suplanuoti dienai</div><div class="chips">${[0,1,2,3,4,5,6].map(i=>{const s=addDays(t.week,i);return `<button class="chip" data-act="t-move" data-id="${t.id}" data-to="day" data-date="${s}">${WDS[i]} ${pd(s).getDate()}</button>`}).join('')}</div>`}
      h+=`<div class="lbl">Perkelti</div><div class="chips">${t.date?`<button class="chip" data-act="t-move" data-id="${t.id}" data-to="tomorrow">Rytoj</button>`:''}${t.month?`<button class="chip" data-act="t-move" data-id="${t.id}" data-to="thisweek">Šios savaitės planai</button>`:`<button class="chip" data-act="t-move" data-id="${t.id}" data-to="nextweek">Kitos savaitės planai</button>`}${t.month?`<button class="chip" data-act="t-move" data-id="${t.id}" data-to="next">Kitas mėnuo</button>`:''}</div><div class="daterow"><input type="date" class="field" id="t-date" value="${addDays(t.date||td,1)}"><button class="act" data-act="t-move" data-id="${t.id}" data-to="date">Į šią datą</button></div>`}}
  h+=`<div class="btnrow" style="margin-top:22px;justify-content:space-between"><button class="act danger" data-act="t-del" data-id="${t.id}">Ištrinti</button><button class="act" data-act="close">Gerai</button></div>`;return h},true)}

function openDay(s){F={dkind:view==='year'?'gim':'ivykis'};openSheet(()=>{const evs=eventsOn(s),ts=dayTasks(s);return `<h2>${WD[wdi(s)]}</h2><div class="ro" style="margin-top:-8px">${longDate(s)}</div><input class="field" id="dq-text" placeholder="Vardas, įvykis ar darbas…" autocomplete="off" enterkeyhint="done"><div class="chips" style="margin-top:10px">${chipGroup('dkind',{gim:'★ Gimtadienis',var:'★ Vardadienis',sv:'★ Šventė',ivykis:'● Įvykis',task:'☐ Darbas'},F.dkind)}</div><div class="daterow" style="align-items:center"><span class="hint">Laikas (nebūtina)</span><input type="time" class="field tm-in" id="dq-time"></div><button class="primary" data-act="dq-save" data-date="${s}">Pridėti</button>${evs.length||ts.length?'<div class="lbl">Šią dieną</div>':''}${evs.length?`<div class="evs">${evs.map(evChip).join('')}</div>`:''}${listHtml(ts,{kind:'day',key:s})}<div class="btnrow" style="margin-top:14px"><button class="act" data-act="goto-week" data-date="${s}">Atidaryti savaitę ›</button></div>`},true)}

function evDateOf(ev){const t=TODAY();if(ev.repeat==='once')return ev.y+'-'+pad(ev.m)+'-'+pad(ev.d);if(ev.repeat==='monthly')return mk(t)+'-'+pad(Math.min(ev.d,daysIn(mk(t))));return (view==='year'?curYear:+t.slice(0,4))+'-'+pad(ev.m)+'-'+pad(ev.d)}
function eventFields(ev,date){return `<div class="lbl">Data ir laikas</div><div class="daterow" style="margin-top:0"><input type="date" class="field" id="e-date" value="${ev?evDateOf(ev):(date||TODAY())}"><input type="time" class="field tm-in" id="e-time" value="${ev&&ev.time?esc(ev.time):''}"></div><div class="lbl">Tipas</div><div class="chips">${chipGroup('type',ETYPES,F.type)}</div><div class="lbl">Kartojasi</div><div class="chips">${chipGroup('repeat',REP,F.repeat)}</div>`}
function openEventForm(id,date){const ev=id?S.events.find(e=>e.id===id):null;if(id&&!ev)return;F={type:ev?ev.type:'gim',repeat:ev?ev.repeat:'yearly',repTouched:!!ev};
  openSheet(()=>`<h2>${ev?'Proga':'Nauja proga'}</h2><input class="field" id="e-title" placeholder="Pvz. Aurimas, Dantistė…" value="${ev?esc(ev.title):''}" autocomplete="off">${eventFields(ev,date)}<button class="primary" data-act="ev-save" data-id="${id||''}">Išsaugoti</button>${ev?`<button class="act danger" style="margin-top:10px;width:100%" data-act="ev-del" data-id="${id}">Ištrinti</button>`:''}`,false)}
function readEvent(title){const dv=$('#e-date').value;if(!title||!dv)return null;const[y,m,d]=dv.split('-').map(Number);return {title,type:F.type,repeat:F.repeat,y,m,d,time:($('#e-time').value||null)}}

/* rec form */
function recFields(){return `<div class="lbl">Kaip dažnai</div><div class="chips">${chipGroup('freq',{weekly:'Kas savaitę',monthly:'Kas mėnesį'},F.freq)}</div><div id="rf-when">${recWhen()}</div><div class="lbl">Laikas (nebūtina)</div><input type="time" class="field sm" id="r-time" value="${esc(F.time||'')}">`}
function recWhen(){return F.freq==='monthly'?`<div class="lbl">Mėnesio diena</div><input type="number" min="1" max="31" class="field sm" id="r-dom" value="${F.dom||1}" style="width:110px">`:`<div class="lbl">Savaitės dienos</div><div class="chips">${wdChips('rday',F.days)}</div>`}
function openRecForm(id,text){const r=id?S.rec.find(x=>x.id===id):null;if(id&&!r)return;F={freq:r?r.freq:'weekly',days:r?r.days.slice():[],dom:r?r.dom:1,time:r?r.time:''};
  openSheet(()=>`<h2>${r?'Pasikartojantis':'Naujas pasikartojantis'}</h2><input class="field" id="r-text" placeholder="Pvz. Lankstumo treniruotė" value="${esc(r?r.text:(text||''))}" autocomplete="off">${recFields()}<button class="primary" data-act="rec-save" data-id="${id||''}">Išsaugoti</button>${r?`<button class="act danger" style="margin-top:10px;width:100%" data-act="rec-del" data-id="${id}">Ištrinti</button>`:''}`,false)}
function readRec(text){F.time=$('#r-time').value||null;if(F.freq==='monthly')F.dom=Math.max(1,Math.min(31,+($('#r-dom').value||1)));if(!text||(F.freq==='weekly'&&!F.days.length))return null;return {text,freq:F.freq,days:F.days.slice().sort(),dom:F.dom,time:F.time}}
function clearFutureGen(field,id){const td=TODAY();S.tasks=S.tasks.filter(t=>!(t[field]===id&&t.status==='open'&&t.date>=td));Object.keys(S.gen).forEach(k=>{if(k.indexOf(id)>=0){const m=k.match(/\d{4}-\d{2}-\d{2}/);if(!m||m[0]>=td)delete S.gen[k]}})}
function recText(r){const w=r.freq==='monthly'?'kas mėn. '+r.dom+' d.':r.days.map(i=>WDS[i]).join(', ');return w+(r.time?' · '+r.time:'')}
function openRecurring(){openSheet(()=>`<h2>Pasikartojantys</h2><p class="note">Atsiranda patys savaitės dienose. Paspausk, kad pakeistum.</p>${S.rec.map(r=>`<button class="ri tap flex" data-act="edit-rec" data-id="${r.id}"><div><div class="rt">${esc(r.text)}</div><div class="ro" style="margin:3px 0 0">⟳ ${esc(recText(r))}</div></div><span class="ty">›</span></button>`).join('')||'<p class="hint">Kol kas nieko nėra.</p>'}<button class="primary" data-act="new-rec">+ Naujas pasikartojantis</button>`,true)}

/* term form */
function termFields(){return `<div class="lbl">Terminas</div><div class="chips">${chipGroup('tfreq',{monthly:'Kas mėnesį',yearly:'Kasmet'},F.tfreq)}</div><div id="tf-when">${termWhen()}</div><div class="lbl">Kada priminti</div><div class="chips">${chipGroup('tmode',{wd:'Pasirinktą savaitės dieną',before:'Likus kelioms dienoms'},F.tmode)}</div><div id="tf-mode">${termMode()}</div><div class="preview" id="tf-prev">${termPreview()}</div>`}
function termWhen(){return F.tfreq==='monthly'?`<div class="daterow" style="align-items:center"><span class="hint">Iki mėnesio</span><input type="number" min="1" max="31" class="field sm" id="tf-dom" value="${F.d||28}" style="width:90px;flex:none"><span class="hint">dienos</span></div>`:`<div class="daterow"><input type="date" class="field" id="tf-ydate" value="${F.ydate||TODAY()}"></div>`}
function termMode(){return F.tmode==='wd'?`<div class="chips" style="margin-top:10px">${wdChips('twd',F.wd)}</div><p class="hint" style="margin:8px 0 0">Priminsiu paskutinę pažymėtą dieną iki termino – pvz. treniruotės dieną, kai mokėsi vietoje.</p>`:`<div class="daterow" style="align-items:center"><input type="number" min="0" max="120" class="field sm" id="tf-before" value="${F.before!=null?F.before:3}" style="width:90px;flex:none"><span class="hint">dienų prieš terminą</span></div>`}
function readTermForm(){const d=$('#tf-dom'),y=$('#tf-ydate'),b=$('#tf-before');if(d)F.d=Math.max(1,Math.min(31,+(d.value||28)));if(y)F.ydate=y.value;if(b)F.before=Math.max(0,+(b.value||0))}
function termFromF(title){const r={title,freq:F.tfreq,mode:F.tmode,wd:F.wd.slice(),before:F.before!=null?F.before:3};if(F.tfreq==='monthly'){r.d=F.d||28}else{const[yy,mm,dd]=(F.ydate||TODAY()).split('-').map(Number);r.m=mm;r.d=dd}return r}
function termPreview(){readTermForm();const r=termFromF('x');if(r.mode==='wd'&&!r.wd.length)return 'Pažymėk bent vieną savaitės dieną.';const d=nextDue(r);if(!d)return '';const rem=remindOf(r,d);return `Artimiausias terminas: <b>${shortDate(d)}</b>. Priminimas: <b>${WD[wdi(rem)].toLowerCase()}, ${longDate(rem)}</b>`}
const refreshPrev=()=>{const p=$('#tf-prev');if(p)p.innerHTML=termPreview()};
function openTermForm(id,title){const r=id?S.terms.find(x=>x.id===id):null;if(id&&!r)return;const Y=TODAY().slice(0,4);
  F={tfreq:r?r.freq:'monthly',tmode:r?r.mode:'wd',wd:r&&r.wd?r.wd.slice():[],before:r?r.before:3,d:r?r.d:28,ydate:r&&r.freq==='yearly'?Y+'-'+pad(r.m)+'-'+pad(r.d):TODAY()};
  openSheet(()=>`<h2>${r?'Keisti terminą':'Naujas terminas'}</h2>${r?'<p class="note">Keiti esamą. Naujam spausk „+ Naujas“.</p>':''}<input class="field" id="tf-title" placeholder="Pvz. Sumokėti už šokius" value="${esc(r?r.title:(title||''))}" autocomplete="off">${termFields()}<button class="primary" data-act="term-save" data-id="${id||''}">Išsaugoti</button>${r?`<button class="act danger" style="margin-top:10px;width:100%" data-act="term-del" data-id="${id}">Ištrinti</button>`:''}`,false)}
function openTerms(){openSheet(()=>`<h2>Mokėjimai ir terminai</h2>${termRows()||'<p class="hint">Kol kas nieko nėra.</p>'}<button class="primary" data-act="add-term">+ Naujas terminas</button>`,true)}

/* quick add */
function quickExtra(){const tm=`<input type="time" class="field tm-in" id="q-time">`;
  const cat=`<div class="lbl">Kategorija</div><div class="chips">${chipGroup('cat',{asm:'Asmeninis',darbo:'Darbas'},F.cat)}</div>`;
  if(F.where==='today'||F.where==='tomorrow')return cat+`<div class="lbl">Laikas (nebūtina)</div><div class="daterow" style="margin-top:0">${tm}</div>`;
  if(F.where==='date')return cat+`<div class="lbl">Data ir laikas</div><div class="daterow" style="margin-top:0"><input type="date" class="field" id="q-date" value="${addDays(TODAY(),2)}">${tm}</div>`;
  if(F.where==='week')return cat;
  if(F.where==='month')return `<div class="lbl">Sąrašas</div><div class="chips">${chipGroup('list',{asm:'Asmeniniai',darbo:'Darbo planai',pirk:'Pirkiniai'},F.list)}</div>`;
  if(F.where==='event')return eventFields(null,TODAY());
  if(F.where==='rec')return recFields();
  if(F.where==='term')return termFields();
  return ''}
function openQuick(){F={where:view==='shop'?'shop':'today',cat:'asm',list:'asm',type:'gim',repeat:'yearly',freq:'weekly',days:[],dom:1,time:'',tfreq:'monthly',tmode:'wd',wd:[],before:3,d:28,ydate:TODAY()};
  openSheet(()=>`<h2>Naujas įrašas</h2><input class="field" id="q-text" placeholder="Ką reikia nepamiršti?" enterkeyhint="done" autocomplete="off"><div class="lbl">Kur dėti?</div><div class="chips">${chipGroup('where',{today:'Šiandien',tomorrow:'Rytoj',date:'Kita data',week:'Sav. planai',month:'Mėnesio sąrašas',event:'★ Proga / ● įvykis',rec:'⟳ Kartojasi',term:'● Mokėjimas / terminas',shop:'🛒 Pirkiniai'},F.where)}</div><div id="q-extra">${quickExtra()}</div><button class="primary" data-act="qa-save">Pridėti</button>`,false);setTimeout(()=>{const i=$('#q-text');if(i)i.focus()},280)}
function qaSave(){const txt=(($('#q-text')||{}).value||'').trim();if(!txt){toast('Įrašyk tekstą');return}const t=TODAY();const tm=($('#q-time')||{}).value||null;
  if(F.where==='event'){const e=readEvent(txt);if(!e)return;S.events.push(Object.assign({id:uid()},e))}
  else if(F.where==='rec'){const r=readRec(txt);if(!r){toast('Pasirink dienas');return}S.rec.push(Object.assign({id:uid(),from:t},r))}
  else if(F.where==='term'){readTermForm();if(F.tmode==='wd'&&!F.wd.length){toast('Pažymėk savaitės dieną');return}S.terms.push(Object.assign({id:uid(),from:t},termFromF(txt)))}
  else if(F.where==='shop'){addShop(txt)}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.dataset.act==='a-signup'){authDo('signup');return}if(el.dataset.act==='a-reset'){authDo('reset');return}if(booting){toast('Kraunama…');return}try{onAct(el)}catch(err){console.error(err);toast('Klaida: '+(err&&err.message));try{render()}catch(e2){}}});
function onAct(el){const a=el.dataset.act,id=el.dataset.id;
  switch(a){
  case 'tab':view=el.dataset.view;scrollWant=true;renderMain();break;
  case 'prev':case 'next':{const n=a==='next'?1:-1;if(view==='week')curWeek=addDays(curWeek,7*n);else if(view==='year')curYear+=n;else curMonth=addMonths(curMonth,n);scrollWant=true;renderMain();break}
  case 'today':resetNav();scrollWant=true;renderMain();break;
  case 'settings':openSettings();break;
  case 'quick':openQuick();break;
  case 'close':closeSheet();break;
  case 'toggle':{const t=byId(id);if(!t)break;const l=leaf(t);
    if(t.status==='cancel'){openTask(id);break}
    if(l&&(t.status==='moved'||t.status==='done'))setStatus(l,l.status==='done'?'open':'done');
    else setStatus(t,t.status==='done'?'open':'done');save();render();break}
  case 'task':openTask(id);break;
  case 'day':openDay(el.dataset.date);break;
  case 'goto-week':curWeek=mondayOf(el.dataset.date);view='week';closeSheet(true);setTimeout(()=>{const c=$('#d-'+el.dataset.date);if(c)try{c.scrollIntoView({block:'start',behavior:'smooth'})}catch(err){}},60);break;
  case 'goto-month':curMonth=el.dataset.m;view='month';scrollWant=true;renderMain();break;
  case 'add-event':openEventForm(null,el.dataset.date);break;
  case 'edit-event':if(id&&id!=='null'&&id!=='undefined')openEventForm(id);break;
  case 'chip':{const g=el.dataset.group,v=el.dataset.val;if(['tfreq','tmode'].includes(g))readTermForm();setChip(g,v);
    if(g==='where')$('#q-extra').innerHTML=quickExtra();
    if(g==='type'&&!F.repTouched)setChip('repeat',v==='ivykis'?'once':'yearly');if(g==='repeat')F.repTouched=true;
    if(g==='freq')$('#rf-when').innerHTML=recWhen();
    if(g==='tfreq'){$('#tf-when').innerHTML=termWhen();refreshPrev()}if(g==='tmode'){$('#tf-mode').innerHTML=termMode();refreshPrev()}break}
  case 'kchip':{K.list=el.dataset.val;$$('[data-act="kchip"]').forEach(c=>c.classList.toggle('on',c.dataset.val===K.list));const r=$('#k-daterow');if(r)r.hidden=K.list!=='date';break}
  case 'kel-add':{const txt=($('#k-text').value||'').trim();if(!txt){toast('Įrašyk, kas keliasi');break}const nm=addMonths(curMonth,1);
    if(K.list==='date'){const dv=$('#k-date').value;if(!dv){toast('Pasirink datą');break}const[y,m,d]=dv.split('-').map(Number);S.events.push({id:uid(),title:txt,type:'ivykis',repeat:'once',y,m,d,time:$('#k-time').value||null,carried:true})}
    else newTask(txt,{month:nm,list:K.list},{carried:true});
    save();render();toast('Keliasi → '+(K.list==='date'?'kalendorių':LISTN[K.list].toLowerCase()));break}
  case 'qa-save':qaSave();break;
  case 'ev-save':{const ev=readEvent(($('#e-title').value||'').trim());if(!ev){toast('Įrašyk pavadinimą ir datą');break}
    if(id){Object.assign(S.events.find(x=>x.id===id),ev)}else S.events.push(Object.assign({id:uid()},ev));save();closeSheet();toast('Išsaugota');break}
  case 'ev-del':S.events=S.events.filter(x=>x.id!==id);save();closeSheet();toast('Ištrinta');break;
  case 't-done':{const t=byId(id);setStatus(t,t.status==='done'?'open':'done');save();render();break}
  case 't-imp':{const t=byId(id);t.imp=!t.imp;save();render();break}
  case 't-cancel':{const t=byId(id);setStatus(t,t.status==='cancel'?'open':'cancel');save();render();break}
  case 't-del':delTask(id);save();closeSheet();toast('Ištrinta');break;
  case 't-move':{const t=byId(id);if(!t)break;const to=el.dataset.to,td=TODAY();let place,kind='mig',extra=null;
    if(to==='day'){place={date:el.dataset.date};kind='sched'}
    else if(to==='date'){const v=$('#t-date').value;if(!v){toast('Pasirink datą');break}place={date:v};if(!t.date)kind='sched'}
    else if(to==='tomorrow')place={date:addDays(t.date||td,1)};
    else if(to==='nextweek')place={week:addDays(mondayOf(t.date||t.week||td),7)};
    else if(to==='thisweek'){place={week:mondayOf(td)};kind='sched'}
    else if(to==='next'){place={month:addMonths(t.month||mk(td),1),list:t.list||'asm'};extra={carried:true}}

  case 'proj-save':{const n=($('#p-name').value||'').trim();if(!n){toast('Įrašyk pavadinimą');break}const d=el.dataset;const place=d.kind==='day'?{date:d.key}:d.kind==='week'?{week:d.key}:{month:d.key,list:d.list||'darbo'};

  case 'pi-save':{try{const o=JSON.parse($('#pi-text').value);if(!o||!Array.isArray(o.tasks))throw 0;S=normalize(o);S.settings.started=true;save();closeSheet(true);toast('Kopija įkelta')}catch(err){toast('Netinkamas tekstas')}break}

  case 'rec-save':{const r=readRec(($('#r-text').value||'').trim());if(!r){toast('Įrašyk pavadinimą ir pasirink dienas');break}

  case 'term-del':S.terms=S.terms.filter(r=>r.id!==id);clearFutureGen('term',id);save();closeSheet();toast('Ištrinta');break;
  case 'habit':{const k=hkey(el.dataset.m,el.dataset.h,el.dataset.d);if(S.hlog[k])delete S.hlog[k];else S.hlog[k]=1;save();render();break}
  case 'habits-edit':if(!S.habits[curMonth])S.habits[curMonth]=habitsFor(curMonth).map(h=>Object.assign({},h));openHabitsEdit();break;
  case 'hab-add':{const inp=$('#h-name');const n=(inp&&inp.value||'').trim();if(!n){toast('Įrašyk įprotį');break}const list=S.habits[curMonth]||(S.habits[curMonth]=[]);list.push({id:uid(),name:n,c:HCOL[list.length%HCOL.length]});save();render();setTimeout(()=>{const i=$('#h-name');if(i){i.value='';i.focus()}},30);toast('Pridėta');break}
  case 'hab-del':{const list=S.habits[curMonth]||[];list.forEach((h,i)=>{if(!h.c)h.c=hcol(h,i)});S.habits[curMonth]=list.filter(x=>x.id!==id);save();render();toast('Ištrinta');break}
  case 'shop-toggle':{const x=S.shop.find(x=>x.id===id);if(x){x.done=!x.done;x.t=Date.now();S.shop=S.shop.filter(y=>y!==x);x.done?S.shop.push(x):S.shop.unshift(x)}save();render();break}
  case 'shop-sug':addShop(el.dataset.name);save();render();break;
  case 'shop-clear':S.shop=S.shop.filter(x=>!x.done);save();render();break;
  case 'shop-edit':{const x=S.shop.find(x=>x.id===id);if(!x)break;openSheet(()=>`<h2>Prekė</h2><input class="field" id="sh-text" value="${esc(x.text)}" autocomplete="off"><button class="primary" data-act="shop-save" data-id="${id}">Išsaugoti</button><button class="act danger" style="margin-top:10px;width:100%" data-act="shop-del" data-id="${id}">Ištrinti iš sąrašo</button><button class="act" style="margin-top:8px;width:100%" data-act="shop-forget" data-id="${id}">Ištrinti ir iš pasiūlymų</button>`,false);break}
  case 'shop-save':{const x=S.shop.find(x=>x.id===id);const v=($('#sh-text').value||'').trim();if(x&&v)x.text=v;save();closeSheet();break}
  case 'shop-del':S.shop=S.shop.filter(x=>x.id!==id);save();closeSheet();break;
  case 'shop-forget':{const x=S.shop.find(x=>x.id===id);if(x)Object.keys(S.shopHist).forEach(k=>{if(k.toLowerCase()===x.text.toLowerCase())delete S.shopHist[k]});S.shop=S.shop.filter(x=>x.id!==id);save();closeSheet();break}
  case 'set-hol':S.settings.hol=!S.settings.hol;save();render();break;
  case 'export':doExport();break;
  case 'import':$('#imp-file').click();break;
  case 'copy-json':{const ta=$('#exp-json');try{navigator.clipboard.writeText(ta.value).then(()=>toast('Nukopijuota'),()=>{ta.select();toast('Pažymėk ir nukopijuok')})}catch(err){ta.select()}break}
  case 'demo':if(F.arm!=='demo'){F.arm='demo';render();break}S=demo();save();resetNav();closeSheet(true);toast('Pavyzdžiai įkelti');break;
  case 'reset':if(F.arm!=='reset'){F.arm='reset';render();break}S=blank();S.settings.started=true;S.terms.push(poleTerm());save();resetNav();closeSheet(true);toast('Švarus lapas');break;
  case 'w-demo':S=demo();save();closeSheet(true);break;
  case 'w-empty':S=blank();S.settings.started=true;S.settings.fix1=true;S.terms.push(poleTerm());save();closeSheet(true);break;
  }
}
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='shop-form'){const i=$('#shop-in');addShop(i.value);i.value='';save();render();const n=$('#shop-in');if(n)n.focus();return}
  const f=e.target.closest('form.add');if(!f)return;const inp=f.querySelector('input');const v=(inp.value||'').trim();if(!v)return;
  const k=f.dataset.kind,key=f.dataset.key,list=f.dataset.list,cat=f.dataset.cat,par=f.dataset.parent;const inSheet=!!f.closest('.sheet');
  newTask(v,k==='day'?{date:key}:k==='week'?{week:key}:{month:key,list},{cat:cat==='darbo'||list==='darbo'?'darbo':null,parent:par||null});inp.value='';save();render();
  const root=inSheet?$('#sheet'):$('#main');const nf=root.querySelector(`form.add[data-kind="${k}"][data-key="${key}"][data-list="${list}"][data-cat="${cat}"][data-parent="${par}"] input`);if(nf)nf.focus()});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='t-text'||id==='t-time'){const t=byId(e.target.dataset.id);if(t){if(id==='t-text')t.text=e.target.value;else t.time=e.target.value||null;persistLocal();queueFlush()}}
  if(id==='tf-dom'||id==='tf-before'||id==='tf-ydate')refreshPrev()});
document.addEventListener('keydown',e=>{const id=e.target.id;if(e.key==='Enter'){
  if(id==='q-text'){e.preventDefault();qaSave()}else if(id==='h-name'){e.preventDefault();const b=$('[data-act="hab-add"]');if(b)b.click()}else if(id==='dq-text'){e.preventDefault();const b=$('[data-act="dq-save"]');if(b)b.click()}else if(id==='p-name'){e.preventDefault();const b=$('[data-act="proj-save"]');if(b)b.click()}else if(id==='k-text'){e.preventDefault();const b=$('[data-act="kel-add"]');if(b)b.click()}else if(id==='t-text'){e.preventDefault();e.target.blur()}}
  if(e.key==='Escape'&&stack.length)closeSheet()});
$('#imp-file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.tasks))throw 0;S=normalize(o);S.settings.started=true;save();closeSheet(true);toast('Kopija įkelta')}catch(err){toast('Netinkamas failas')}};r.readAsText(f);e.target.value=''});
async function doExport(){const data=JSON.stringify(S);const fn='uzrasine-'+TODAY()+'.json';
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Atsisiųsta');return}catch(err){}
  const box=$('#exp-box');if(box)box.innerHTML=`<p class="hint" style="margin:10px 0 6px">Nukopijuok šį tekstą ir išsisaugok:</p><textarea class="field json" id="exp-json" readonly>${esc(data)}</textarea><button class="act" style="margin-top:8px" data-act="copy-json">Kopijuoti</button>`}

/* ---------- boot ---------- */
resetNav();
S=loadLocal()||blank();
scrollWant=true;render();
if(!S.settings.started&&!cfgOk())openWelcome();
initSync();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let lastDay=TODAY();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const t=TODAY();if(t!==lastDay){lastDay=t;resetNav();scrollWant=true;render()}}});
</script>
</body>
</html>
